name: Build APK (EAS)
on:
  workflow_dispatch:
    inputs:
      aksi:
        description: 'build = buat APK baru, update = kirim pembaruan ke HP'
        type: choice
        options: [build, update]
        default: build
  push:
    branches: [main]
    paths: ['App.js', 'src/**', 'assets/**']
jobs:
  eas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Siapkan proyek Expo dari kode Ingetin
        run: |
          npx create-expo-app@latest app --template blank --yes
          rm -f app/App.js
          cp App.js app/App.js
          cp -r src app/src
          mkdir -p app/assets
          cp -r assets/. app/assets/
          cp scripts/atur-app.js app/atur-app.js
          if [ -f google-services.json ]; then cp google-services.json app/google-services.json; fi
          cd app
          npx expo install @react-native-async-storage/async-storage expo-crypto @react-native-community/datetimepicker expo-linear-gradient @expo/vector-icons expo-updates @supabase/supabase-js react-native-url-polyfill react-native-view-shot expo-sharing expo-clipboard expo-notifications expo-constants expo-image-picker expo-build-properties
          node atur-app.js awal
          echo '{"build":{"preview":{"channel":"preview","android":{"buildType":"apk"}},"production":{"channel":"production","android":{"buildType":"app-bundle"}}}}' > eas.json
          eas init --force --non-interactive
          node atur-app.js updates
      - name: Kirim pembaruan otomatis ke HP
        if: github.event_name == 'push' || inputs.aksi == 'update'
        working-directory: app
        env:
          PESAN: ${{ github.event.head_commit.message || 'Pembaruan manual' }}
        run: eas update --channel preview --message "$PESAN" --non-interactive
      - name: Build APK baru
        if: github.event_name == 'workflow_dispatch' && inputs.aksi == 'build'
        working-directory: app
        run: eas build --platform android --profile preview --non-interactive --no-wait
