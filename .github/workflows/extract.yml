name: Ekstrak kode
on: workflow_dispatch
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o ingetin-push.zip -x ".github/*"
          rm ingetin-push.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Ekstrak kode Ingetin"
          git push
